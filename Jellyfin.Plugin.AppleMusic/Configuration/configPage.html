<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Template</title>
</head>
<body>
<div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="TemplateConfigForm">
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="AppleMusicRegion">Apple Music Region</label>
                    <input id="AppleMusicRegion" name="AppleMusicRegion" type="text" is="emby-input" required="required" onKeyUp="this.value=this.value.replace(/[^a-zA-Z]/g,'')"/>
                    <span class="fieldDescription">Set Apple Music region,e.g. <code>us</code> or <code>jp</code></span>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="AppleMusicAlbumTitle">Apple Music Album Title</label>
                    <input id="AppleMusicAlbumTitle" name="AppleMusicAlbumTitle" type="text" is="emby-input" required="required" onKeyUp="this.value=this.value.replace(/\s/g,'')"/>
                    <span class="fieldDescription">Set Apple Music album title,e.g. <code>Albums</code> or <code>アルバム</code> or <code>专辑</code></span>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="AppleMusicArtistTitle">Apple Music Artist Title</label>
                    <input id="AppleMusicArtistTitle" name="AppleMusicArtistTitle" type="text" is="emby-input" required="required" onKeyUp="this.value=this.value.replace(/\s/g,'')"/>
                    <span class="fieldDescription">Set Apple Music artist title,e.g. <code>Artists</code> or <code>アーティスト</code> or <code>艺人</code></span>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        const TemplateConfig = {
            pluginUniqueId: 'a9f62a44-fea5-46c3-ac26-55abba29c7c8'
        };

        document.querySelector('#TemplateConfigPage')
            .addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#AppleMusicRegion').value = config.AppleMusicRegion;
                    document.querySelector('#AppleMusicArtistTitle').value = config.AppleMusicArtistTitle;
                    document.querySelector('#AppleMusicAlbumTitle').value = config.AppleMusicAlbumTitle;
                    Dashboard.hideLoadingMsg();
                });
            });

        document.querySelector('#TemplateConfigForm')
            .addEventListener('submit', function (e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(TemplateConfig.pluginUniqueId).then(function (config) {
                    config.AppleMusicRegion = document.querySelector('#AppleMusicRegion').value;
                    config.AppleMusicArtistTitle = document.querySelector('#AppleMusicArtistTitle').value;
                    config.AppleMusicAlbumTitle = document.querySelector('#AppleMusicAlbumTitle').value;
                    ApiClient.updatePluginConfiguration(TemplateConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
    </script>
</div>
</body>
</html>
